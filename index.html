<title>Keep: schedule it, honor it, earn it</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#0e0e10;--panel:#17171a;--line:#2a2a2f;--ink:#ececec;--mute:#8b8b94;--coin:#c9a85c;--ok:#7fb08f;--miss:#c0707f;--blk:#212126;--on:#0e0e10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,.num{font-family:Fraunces,Georgia,serif;font-weight:400;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:34px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:2px 0 0}
.purse{display:flex;align-items:center;gap:12px}
.coin{width:34px;height:34px;border-radius:50%;border:2px solid var(--coin);display:grid;place-items:center;color:var(--coin);font-family:Fraunces,Georgia,serif}
.purse .num{font-size:44px;line-height:1;color:var(--coin)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nav h2{font-size:22px;flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.ghost:hover{border-color:var(--mute)}
.stat{color:var(--mute);margin:0 0 12px;font-size:14px}
.grid{position:relative;cursor:cell;overflow:hidden}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);color:var(--mute);font-size:12px;padding-left:2px;pointer-events:none}
.blk{position:absolute;left:46px;right:0;border-radius:6px;border-left:3px solid var(--coin);background:var(--blk);padding:4px 10px;cursor:default;overflow:hidden;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.txt{min-width:0;display:flex;flex-direction:column}
.txt b,.txt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk b{font-weight:500}
.blk small{color:var(--mute)}
.blk.kept{border-color:var(--ok)}
.blk.skipped{border-color:var(--miss);opacity:.65}
.blk.skipped b{text-decoration:line-through}
.acts{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.acts button{border-radius:6px;border:1px solid var(--line);background:var(--panel);padding:0 9px;font-size:13px;line-height:20px}
.acts .keep{border-color:var(--ok);color:var(--ok)}
.acts .skip,.acts .del{color:var(--mute)}
.now{position:absolute;left:40px;right:0;border-top:2px solid var(--miss);pointer-events:none}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:0}
.price{color:var(--coin);font-family:Fraunces,Georgia,serif}
.buy{border:1px solid var(--coin);color:var(--coin);background:none;border-radius:6px;padding:3px 12px}
.buy:disabled{border-color:var(--line);color:var(--mute);cursor:not-allowed}
h2.s{font-size:20px;margin-bottom:6px}
.log{color:var(--mute);font-size:14px;margin:12px 0 0;padding:0;list-style:none}
.add{display:flex;gap:6px;margin-top:12px}
.add input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.add input[type=text]{flex:1}.add input[type=number]{width:70px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:20px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog label{display:block;margin:10px 0 3px;color:var(--mute);font-size:14px}
dialog input,dialog select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.row button{border-radius:6px;padding:6px 14px;border:1px solid var(--line);background:none}
.row .go{background:var(--coin);border-color:var(--coin);color:var(--on);font-weight:500}
.err{color:var(--miss);font-size:14px;min-height:20px;margin:8px 0 0}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 16px;color:var(--mute)}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--coin)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.boost{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.boost h3{font:400 18px Fraunces,Georgia,serif;margin:0}
.boost p{color:var(--mute);margin:0;flex:1}
.boost .own{font-size:13px;color:var(--ok);min-height:20px}
.boost .foot{display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stats .panel{padding:12px 16px}
.k,.n{color:var(--mute);font-size:14px}
.v{font:400 24px Fraunces,Georgia,serif}
.bar{height:4px;background:var(--line);border-radius:2px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coin);width:0}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.al{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.al input,.add select,.pi{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:84px}
.add{flex-wrap:wrap}.add select{width:auto}
.rt{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}
.stats .rt{width:36px;height:36px}
.rp{width:56px;height:56px;border-radius:8px;object-fit:cover}
.add input[type=file]{width:100%;font-size:14px}
.qlabel{color:var(--mute);font-size:14px;margin:0 0 4px}
.quote{margin:0 0 18px;padding:0 0 16px;border-bottom:1px solid var(--line);font:400 21px/1.35 Fraunces,Georgia,serif}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--coin);color:var(--coin);padding:8px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head>
<body><div class="wrap">
<header>
 <div><h1>Keep</h1><p class="sub">Plan the hour. Honor it. Earn it.</p><p class="sub" id="acct" style="font-size:13px"></p></div>
 <div class="purse"><div class="coin" aria-hidden="true">D</div><div><div class="num" id="coins">0</div><div class="n">Discipline</div></div></div>
</header>
<div class="stats">
 <div class="panel"><div class="k">Streak</div><div class="v" id="sv"></div><div class="n" id="sn"></div></div>
 <div class="panel"><div class="k">Rank</div><div class="v" id="rv"></div><div class="bar"><i id="rb"></i></div><div class="n" id="rnk"></div></div>
</div>
<div class="tabs" role="tablist">
 <button class="tab" role="tab" id="tab-sched" aria-selected="true">Schedule</button>
 <button class="tab" role="tab" id="tab-shop" aria-selected="false">Boost shop</button>
 <button class="tab" role="tab" id="tab-admin" aria-selected="false">Admin</button>
</div>
<section id="v-shop" hidden>
 <div class="panel"><h2 class="s">Boost shop</h2>
  <p class="stat">Boosts change how you earn. Each one is used automatically the next time it applies.</p>
  <div class="bgrid" id="boosts"></div></div>
</section>
<section id="v-admin" hidden><div class="agrid" id="admin"></div></section>
<div class="cols" id="v-sched">
 <section class="panel" aria-label="Schedule">
  <div class="nav">
   <button class="ghost" id="prev" aria-label="Previous day">&lsaquo;</button>
   <h2 id="date"></h2>
   <button class="ghost" id="today">Today</button>
   <button class="ghost" id="next" aria-label="Next day">&rsaquo;</button>
  </div>
  <p class="stat" id="stat"></p>
  <div class="grid" id="grid"></div>
 </section>
 <section class="panel" aria-label="Rewards">
  <p class="qlabel">Today's line on discipline</p>
  <blockquote class="quote" id="quote"></blockquote>
  <h2 class="s">Rewards</h2>
  <p class="stat" id="rules"></p>

}
function acctUI(){
  $('acct').innerHTML=sess?esc(sess.email||'Signed in')+' <button class="ghost" id="so" style="padding:0 8px;font-size:13px">Sign out</button>':'Not signed in, data stays on this device. <button class="ghost" id="si" style="padding:0 8px;font-size:13px">Sign in or create account</button>';
  ref=sess?{set:async d=>{const t=await token();if(!t)throw 0;const r=await fetch(SB+'/rest/v1/keep_state?on_conflict=user_id',{method:'POST',headers:Object.assign(hd(t),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([{user_id:sess.id,data:d,updated_at:new Date().toISOString()}])});if(!r.ok)throw 0}}:null;
}
async function pull(){
  if(!sess)return;
  try{
    const t=await token();if(!t)return;
    const r=await fetch(SB+'/rest/v1/keep_state?select=data&user_id=eq.'+sess.id,{headers:hd(t)});
    if(!r.ok)return;
    const rows=await r.json();
    if(!rows.length){pushRemote();return}
    const d=rows[0].data;
    if((d.t||0)>(S.t||0)){
      Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,d);
      try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
      render();if(!$('v-admin').hidden)renderAdmin();
    }else if((S.t||0)>(d.t||0))pushRemote();
  }catch(e){}
}
async function go(p){
  const email=$('ae').value.trim(),password=$('ap').value;
  if(!email||password.length<6){$('aerr').textContent='Enter an email and a password with 6+ characters.';return}
  $('aerr').textContent='Working...';
  try{
    const j=await auth(p,{email,password});
    if(!j.access_token){$('aerr').textContent='Check your email to confirm your account, then sign in.';return}
    setSess(toSess(j));$('ad').close();acctUI();await pull();
  }catch(e){$('aerr').textContent=e.message}
}
$('ai').onclick=()=>go('token?grant_type=password');
$('au').onclick=()=>go('signup');
$('an').onclick=()=>{try{localStorage.setItem('keep-skip','1')}catch(e){}$('ad').close()};
$('ap').onkeydown=e=>{if(e.key==='Enter')$('ai').click()};
$('acct').onclick=e=>{
  if(e.target.id==='si'){$('aerr').textContent='';$('ad').showModal()}
  if(e.target.id==='so'){try{localStorage.removeItem(K);localStorage.removeItem('keep-sess')}catch(x){}location.reload()}
};
acctUI();
if(sess)pull();else{let sk=null;try{sk=localStorage.getItem('keep-skip')}catch(e){}if(!sk)$('ad').showModal()}
setInterval(pull,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>
